[project]
name = "pythonplot"
version = "0.1.0"
description = "An Introduction to Python Plotting for Exploratory Data Analysis"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Core Jupyter/IPython
    "ipython>=9.18.1",
    "notebook>=7.6.5",
    "jupyter>=1.0",

    # Data manipulation
    "pandas>=3.1.1",

    # Plotting libraries
    "matplotlib>=3.11.2",
    "seaborn>=0.13",
    "plotnine>=0.15.8",
    "lets-plot>=4.11",
    "plotly>=7.1.0",
    "altair>=6.3.0",
    "vl-convert-python>=1.0",  # Required for Altair PNG export
    "hvplot>=0.12",  # Bokeh via the pandas .hvplot accessor

    # Image rendering
    "kaleido>=1.5.0",  # v1+ requires Chrome
    "pillow>=13.0.0",
    "selenium>=4.52.0",  # Required for Bokeh PNG export

    # Statistical tools
    "statsmodels>=0.15.0",
    "scikit-misc>=0.5.3",

    # R integration
    "rpy2>=3.6.9",

    # Template rendering
    "jinja2>=3.1",
    "jinja2-highlight>=0.6",
    "markdown>=3.11.3",

    # Utilities
    "psutil>=5.9",
    "tzlocal>=5.4.5",
    "simplegeneric>=0.8",

    # Cloud (if needed for deployment)
    "boto3>=1.43.126",

    # Testing
    "pytest>=9.2.0",
]

[dependency-groups]
dev = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
