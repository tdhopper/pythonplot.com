[project]
name = "pythonplot"
version = "0.1.0"
description = "An Introduction to Python Plotting for Exploratory Data Analysis"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Core Jupyter/IPython
    "ipython>=8.12",
    "notebook>=7.6.2",
    "jupyter>=1.0",

    # Data manipulation
    "pandas>=2.0",

    # Plotting libraries
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "plotnine>=0.15.8",
    "lets-plot>=4.11",
    "plotly>=5.24",
    "altair>=5.0",
    "vl-convert-python>=1.0",  # Required for Altair PNG export
    "hvplot>=0.12",  # Bokeh via the pandas .hvplot accessor

    # Image rendering
    "kaleido>=1.0",  # v1+ requires Chrome
    "pillow>=10.0",
    "selenium>=4.47.0",  # Required for Bokeh PNG export

    # Statistical tools
    "statsmodels>=0.14.6",
    "scikit-misc>=0.3",

    # R integration
    "rpy2>=3.5",

    # Template rendering
    "jinja2>=3.1",
    "jinja2-highlight>=0.6",
    "markdown>=3.5",

    # Utilities
    "psutil>=5.9",
    "tzlocal>=5.0",
    "simplegeneric>=0.8",

    # Cloud (if needed for deployment)
    "boto3>=1.43.78",

    # Testing
    "pytest>=7.4",
]

[dependency-groups]
dev = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
